<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de CO2</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🌍 Calculadora de CO2</h1>
            <p class="subtitle">Calcule as emissões de CO2 do seu transporte</p>
        </header>

        <main>
            <form id="co2Form">
                <div class="form-group">
                    <label for="distance">Distância (km)</label>
                    <input 
                        type="number" 
                        id="distance" 
                        name="distance" 
                        placeholder="Digite a distância em quilômetros"
                        min="0.01"
                        step="0.1"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="transport">Meio de Transporte</label>
                    <select id="transport" name="transport" required>
                        <option value="">Selecione um meio de transporte</option>
                        <option value="bicycle">🚴 Bicicleta</option>
                        <option value="motorcycle">🏍️ Motocicleta</option>
                        <option value="car">🚗 Carro</option>
                        <option value="bus">🚌 Ônibus</option>
                        <option value="truck">🚚 Caminhão</option>
                    </select>
                </div>

                <button type="submit" class="btn-calculate">Calcular Emissões</button>
            </form>

            <div id="result" class="result hidden">
                <h2>Resultado</h2>
                <div class="result-content">
                    <div class="emission-value">
                        <span class="value" id="emissionValue">0</span>
                        <span class="unit">kg CO2</span>
                    </div>
                    <div class="details">
                        <p><strong>Distância:</strong> <span id="resultDistance">0</span> km</p>
                        <p><strong>Transporte:</strong> <span id="resultTransport">-</span></p>
                        <p><strong>Fator de Emissão:</strong> <span id="resultFactor">0</span> kg CO2/km</p>
                    </div>
                </div>
                <div class="environmental-tip" id="environmentalTip"></div>
            </div>
        </main>

        <footer>
            <p>Calculadora de CO2 - Conscientização Ambiental</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
